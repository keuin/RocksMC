# Fabric Loom 1.17.x requires a Java 21+ daemon.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Loom does not support the configuration cache for genSources.
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Pinned versions. See docs/storage-io-analysis.md for how these were chosen.
# ---------------------------------------------------------------------------
minecraft_version=1.16.5
yarn_mappings=1.16.5+build.10
loader_version=0.16.14

# RocksDB. Phase 0/0c/1a measured against 10.10.1.
rocksdb_version=10.10.1

mod_version=0.1.0-SNAPSHOT
maven_group=com.keuin.rocksmc
archives_base_name=rocksmc
