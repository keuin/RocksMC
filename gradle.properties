# Fabric Loom 1.17.x requires a Java 21+ daemon.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Loom does not support the configuration cache for genSources.
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# Pinned versions. See docs/storage-io-analysis.md for how these were chosen.
# ---------------------------------------------------------------------------
minecraft_version=1.16.5
yarn_mappings=1.16.5+build.10
loader_version=0.16.14

# Fabric API. Only fabric-command-api-v1 is used, and only the one module is
# depended on rather than the whole API -- this mod is a thin storage layer and
# has no business forcing ~2 MB of unrelated API on every server.
#
# Pinned to the Fabric API release running on the beta server so the module
# version resolved here is byte-identical to the one loaded in production
# (fabric-command-api-v1 1.1.2+f74f7c7d7d). Matching that matters: the previous
# command bug was invisible in dev and only appeared under a real mod set.
fabric_api_version=0.41.3+1.16

# RocksDB. Phase 0/0c/1a measured against 10.10.1.
rocksdb_version=10.10.1

# Prometheus client. All modules are Java 8 bytecode, which the mod requires.
prometheus_version=1.8.0

mod_version=0.1.0-SNAPSHOT
maven_group=com.keuin.rocksmc
archives_base_name=rocksmc
